# Local MySQL for trying the store on your own computer:  docker compose -f docker-compose.dev.yml up -d
services:
  db:
    image: mysql:8.4
    ports: ["127.0.0.1:3306:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: devroot
      MYSQL_DATABASE: sportiq
      MYSQL_USER: sportiq
      MYSQL_PASSWORD: sportiq
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--default-time-zone=+00:00"]
    volumes: [dev-db:/var/lib/mysql]
volumes:
  dev-db:
